[paths]
channels_file = config/channels.yaml
filter_file = config/filter.yaml
profile_file = data/profile.json
profile_md_file = data/profile.md
materials_dir = materials
session_file = data/telegram
# файл пульса для Docker healthcheck
heartbeat_file = data/heartbeat.json

[jev]
model=~typesafe/jev-latest
timeout_sec = 20
min_confidence = 0.70
max_text_chars = 3000

[openrouter]
base_url = https://openrouter.ai/api/v1
timeout_sec = 60
max_retries = 2

[dedup]
fuzzy_threshold = 90
window_days = 14
max_candidates = 1000

[telegram]
catchup_limit = 50
# значение по умолчанию; меняется в боте
poll_interval_sec = 120
contact_click_delay_sec = 2
flood_sleep_threshold = 60

[pipeline]
min_text_length = 40
retry_limit = 5
retry_interval_sec = 600

[logging]
level = INFO
file = data/app.log
# ротация файла лога: размер одного файла и число архивных копий
max_bytes = 5242880
backup_count = 3

[ui]
# часовой пояс для времени в боте (IANA)
timezone = Europe/Sofia

[journal]
# начальный срок хранения журнала, дней; меняется в боте.
# Минимум: max(7, [dedup] window_days), максимум 365
retention_days = 30

[alerts]
# начальное значение: слать владельцу алерты (старт, сбои); меняется в боте
enabled = true

[backup]
# папка бэкапов БД и сессии Telegram
dir = data/backups
# сколько последних бэкапов хранить (1..60); меняется в боте
keep = 7
# час ежедневного бэкапа по локальному времени ([ui] timezone)
hour = 4
